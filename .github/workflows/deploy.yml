name: Build & Deploy Backoffice

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"

env:
  REGION: asia-northeast3
  AR_REPO: asia-northeast3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/qjs-docker

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Get secrets from Secret Manager
        run: |
          gcloud secrets versions access latest --secret=qjs-backoffice-env > .env.prod

      - name: Load environment variables
        run: |
          set -a
          source .env.prod
          set +a
          # 시크릿 마스킹 (Actions 로그 노출 방지)
          echo "::add-mask::$NEXT_PUBLIC_API_URL"
          echo "::add-mask::$NEXT_PUBLIC_SITE_URL"
          echo "NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SITE_URL=$NEXT_PUBLIC_SITE_URL" >> $GITHUB_ENV
          # .env.prod 파일은 빌드 컨텍스트에서 즉시 제거
          rm -f .env.prod

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # commit SHA 태그로 롤백 가능성 확보 + latest 별칭 유지
          tags: |
            ${{ env.AR_REPO }}/qjs-backoffice:${{ github.sha }}
            ${{ env.AR_REPO }}/qjs-backoffice:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: qjs-backoffice
          image: ${{ env.AR_REPO }}/qjs-backoffice:${{ github.sha }}
          region: ${{ env.REGION }}
          flags: "--allow-unauthenticated --memory=512Mi --cpu=1 --min-instances=0 --max-instances=2 --concurrency=20 --port=4000"
          env_vars: |
            NODE_ENV=production
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}
